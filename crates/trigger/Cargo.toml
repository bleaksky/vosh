[package]
name = "vosh-trigger"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Regex trigger engine with highlight, gag, replace, send, and route actions."
rust-version.workspace = true

[dependencies]
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
vosh-ansi = { path = "../ansi" }

[features]
# The test kit: the plain entry points and the trigger count the app's
# tests use.
testkit = []

[dev-dependencies]
# The SGR model, whose span colors the readable highlight tests read.
vosh-ansi = { path = "../ansi", features = ["testkit"] }

[lints]
workspace = true
