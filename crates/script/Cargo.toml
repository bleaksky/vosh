[package]
name = "vosh-script"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Embedded Lua scripting engine with sandboxed mud.* API."
rust-version.workspace = true

[dependencies]
# Plain string.find searches with it, in time linear in the subject.
memchr = "2"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
regex = "1"
serde_json = { workspace = true }
thiserror = { workspace = true }
# The variable scope that mud.set_var and mud.set_profile_var name.
vosh-automation = { path = "../automation" }

[features]
# The test kit: an engine whose Lua can nap, which the app's tests use to
# make a slow handler.
testkit = []

[lints]
workspace = true
