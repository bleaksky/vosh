[package]
name = "vosh-prompt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The custom prompt engine for Vosh. Template, renderer, variables, GMCP snapshot and word wrap, with no Tauri."
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Capture patterns: compiling them, and reading their shape for the settle
# rule.
regex = "1"
regex-syntax = "0.8"
# Whether a partial line can still become your prompt, for the hold on a
# prompt a read split.
regex-automata = "0.4"
# Local time for the clock pieces (clock only, no default features).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# The test kit: the game's own prompt printer and a fake Aabahran that
# plays pulses from a PROMPT, for the tests here, the session tests in
# src-tauri and the fake_mud example.
testkit = []

[dev-dependencies]
vosh-protocol = { path = "../protocol" }
# The tests here and the fake_mud example read the test kit.
vosh-prompt = { path = ".", features = ["testkit"] }
# The fake_mud example serves the test kit over TCP.
tokio = { workspace = true }

[lints]
workspace = true
