[package]
name = "vosh-prompt"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "The custom prompt engine for Vosh. Template, renderer, variables, GMCP snapshot and word wrap, with no Tauri."
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Capture patterns: compiling them, and reading their shape for the settle
# rule.
regex = "1"
regex-syntax = "0.8"
# Local time for the clock pieces (clock only, no default features).
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
vosh-gmcp = { path = "../gmcp" }

[lints]
workspace = true
