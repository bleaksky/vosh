[package]
name = "vosh-log"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SQLite-backed session log store with regex search and ANSI export."
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# Only append_raw strips a line, and only tests call it.
vosh-protocol = { path = "../protocol", optional = true }
regex = "1"
serde = { workspace = true }
thiserror = { workspace = true }

[features]
# The test kit: the in-memory store and the readers and writers the app's
# tests use.
testkit = ["dep:vosh-protocol"]

[dev-dependencies]
# The unit tests here call append_raw, so they turn the test kit on, and
# with it vosh-protocol.
vosh-log = { path = ".", features = ["testkit"] }

[lints]
workspace = true
