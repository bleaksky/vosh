[package]
name = "vosh-log"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "SQLite-backed session log store with regex search and ANSI export."
rust-version.workspace = true

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
# Strips the ANSI from a snoop row, and from a line append_raw writes.
vosh-protocol = { path = "../protocol" }
regex = "1"
serde = { workspace = true }
thiserror = { workspace = true }

[features]
# The test kit: the in-memory store and the readers and writers the app's
# tests use.
testkit = []

[dev-dependencies]
# The unit tests here call append_raw, so they turn the test kit on.
vosh-log = { path = ".", features = ["testkit"] }

[lints]
workspace = true
