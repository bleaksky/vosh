name: release

# Tag a release like v0.0.2 to fire this workflow. The gates job runs
# ci.yml first, so a tag passes the same checks as a push before any
# bundle builds. Each platform then builds the Tauri bundle and uploads
# its artifacts to a draft GitHub release, which you publish by hand.
#
# Signing. tauri-action signs and notarizes the macOS builds when the
# six Apple secrets are set, and the repository sets all six, so the
# release notes say so plainly. Windows builds ship unsigned for now.
# A code signing certificate can join the env block below later. The
# minisign keys sign the updater bundles when they are present and are
# skipped when absent.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          # GitHub has been deprecating macos-13 (Intel) runners and
          # the queue often never picks them up. Cross-compile to
          # x86_64 from the arm64 macos-latest runner instead. The
          # "Add Rust target" step installs the target so cargo
          # produces a native x86_64 binary that Tauri bundles into
          # an x86_64 .dmg.
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - platform: ubuntu-22.04
            target: ''
            label: linux-x86_64
          - platform: windows-latest
            target: ''
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads the version, components and profile from
      # rust-toolchain.toml so releases build with the same Rust as CI.
      # --no-self-update leaves the runner rustup alone, so the job skips that download.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Add Rust target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.label }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action uploads built artifacts to the draft GitHub
          # release; without GITHUB_TOKEN the upload step errors out
          # with "GITHUB_TOKEN is required" even though the build
          # itself succeeded. Workflow-level `permissions: contents:
          # write` covers the scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign keypair for the auto-updater. tauri-action signs
          # the update bundles + generates latest.json when both are
          # present; skipped silently when absent.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization. tauri-action
          # auto-detects all six vars; when present, the macOS build
          # runs codesign with the hardened runtime, submits to
          # Apple's notary service via notarytool, and staples the
          # ticket onto the .dmg + .app so Gatekeeper accepts them
          # offline. Without notarization a signed app still gets
          # "App is damaged and can't be opened" on macOS 10.15+
          # when downloaded via a browser (the quarantine xattr
          # triggers Gatekeeper). The Apple ID password must be an
          # app-specific password minted at appleid.apple.com.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'vosh ${{ github.ref_name }}'
          releaseBody: |
            Builds for macOS, Windows and Linux.
            The Mac builds are signed and notarized by Apple.
            Windows may show a SmartScreen warning the first time you run Vosh, because the Windows builds are not signed yet.
            Choose More info and then Run anyway to start it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
