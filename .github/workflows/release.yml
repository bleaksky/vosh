name: release

# Tag a release like v0.0.2 to fire this workflow. Each platform builds
# the Tauri bundle and uploads its artifacts to a draft GitHub release.
# Code signing for macOS and Windows is intentionally deferred; the
# artifacts are unsigned at this stage. The minisign keys for the
# updater plugin are read from secrets when present and skipped when
# absent so the workflow stays usable until you generate them.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          # GitHub has been deprecating macos-13 (Intel) runners and
          # the queue often never picks them up. Cross-compile to
          # x86_64 from the arm64 macos-latest runner instead. The
          # dtolnay/rust-toolchain step installs the target so cargo
          # produces a native x86_64 binary that Tauri bundles into
          # an x86_64 .dmg.
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - platform: ubuntu-22.04
            target: ''
            label: linux-x86_64
          - platform: windows-latest
            target: ''
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          # tauri-action uploads built artifacts to the draft GitHub
          # release; without GITHUB_TOKEN the upload step errors out
          # with "GITHUB_TOKEN is required" even though the build
          # itself succeeded. Workflow-level `permissions: contents:
          # write` covers the scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Minisign keypair for the auto-updater. tauri-action signs
          # the update bundles + generates latest.json when both are
          # present; skipped silently when absent.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple Developer ID signing + notarization. tauri-action
          # auto-detects all six vars; when present, the macOS build
          # runs codesign with the hardened runtime, submits to
          # Apple's notary service via notarytool, and staples the
          # ticket onto the .dmg + .app so Gatekeeper accepts them
          # offline. Without notarization a signed app still gets
          # "App is damaged and can't be opened" on macOS 10.15+
          # when downloaded via a browser (the quarantine xattr
          # triggers Gatekeeper). The Apple ID password must be an
          # app-specific password minted at appleid.apple.com.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'vosh ${{ github.ref_name }}'
          releaseBody: |
            Cross platform builds. Artifacts are not yet code signed.
            macOS users may need to right-click and choose Open the first time.
            Windows users will see a SmartScreen warning until signing lands.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
