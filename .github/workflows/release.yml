name: release

# Tag a release like v0.0.2 to fire this workflow. Each platform builds
# the Tauri bundle and uploads its artifacts to a draft GitHub release.
# Code signing for macOS and Windows is intentionally deferred; the
# artifacts are unsigned at this stage. The minisign keys for the
# updater plugin are read from secrets when present and skipped when
# absent so the workflow stays usable until you generate them.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-13
            target: x86_64-apple-darwin
            label: macos-x86_64
          - platform: ubuntu-22.04
            target: ''
            label: linux-x86_64
          - platform: windows-latest
            target: ''
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          # When you generate a minisign keypair, set these two secrets.
          # Until they exist the bundler still produces installers but
          # the updater signature step is skipped.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'mudclient ${{ github.ref_name }}'
          releaseBody: |
            Cross platform builds. Artifacts are not yet code signed.
            macOS users may need to right-click and choose Open the first time.
            Windows users will see a SmartScreen warning until signing lands.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
