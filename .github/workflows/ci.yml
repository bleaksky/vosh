name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow so a tag runs the same gates first.
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-D warnings'

jobs:
  # Builds the page once for the three Rust jobs. The frontend checks run
  # beside it, so a failed page check never hides a Rust result.
  page:
    name: Page build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: dist
          retention-days: 1
          if-no-files-found: error

  frontend:
    name: Frontend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run css:usage
      - run: npm test

  rust:
    name: Rust (${{ matrix.os }})
    needs: page
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # rustup reads the version, components and profile from
      # rust-toolchain.toml so CI builds with the same Rust as local builds.
      # --no-self-update leaves the runner rustup alone, so the job skips that download.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      # tauri generate_context embeds dist at compile time, and nothing else
      # in the Rust build needs node. The page job builds the page once and
      # every Rust job downloads that same dist.
      - name: Download the page built by the page job
        uses: actions/download-artifact@v4
        with:
          name: page
          path: dist

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features
