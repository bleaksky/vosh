[package]
name = "vosh-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri shell for the Vosh desktop app."
rust-version.workspace = true

[lib]
name = "vosh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
vosh-telnet = { path = "../crates/telnet" }
vosh-alias = { path = "../crates/alias" }
vosh-vars = { path = "../crates/vars" }
vosh-trigger = { path = "../crates/trigger" }
vosh-gmcp = { path = "../crates/gmcp" }
vosh-ansi = { path = "../crates/ansi" }
vosh-map = { path = "../crates/map" }
vosh-script = { path = "../crates/script" }
vosh-log = { path = "../crates/log" }
regex = "1"
toml = "0.8"
font-kit = "0.14"
urlencoding = "2"
quick-xml = "0.36"

[target.'cfg(target_os = "macos")'.dependencies]
# Used by `enable_macos_spellcheck` in lib.rs to message-send
# setContinuousSpellCheckingEnabled: into the WKWebView. Gated
# with respondsToSelector: so a future macOS that drops the
# setter degrades to a no-op instead of an unrecognized-selector
# crash.
objc2 = "0.5"
# Tier 3 native terminal renderer (docs/native-renderer.md). wgpu drives
# a Metal surface on a CAMetalLayer-backed child NSView; pollster blocks
# on its async init during setup; raw-window-handle bridges the NSView.
wgpu = "0.20"
pollster = "0.3"
raw-window-handle = "0.6"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
