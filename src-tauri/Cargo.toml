[package]
name = "vosh-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri shell for the Vosh desktop app."
rust-version.workspace = true

[lib]
name = "vosh_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
vosh-protocol = { path = "../crates/protocol" }
vosh-automation = { path = "../crates/automation" }
vosh-script = { path = "../crates/script" }
vosh-log = { path = "../crates/log" }
vosh-prompt = { path = "../crates/prompt" }
regex = "1"
# Local time for the custom prompt's %time / %date tokens (clock only, no
# default features).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml = "0.8"
font-kit = "0.14"
urlencoding = "2"
quick-xml = "0.36"
# A plugin travels as a .zip (Scripts Q6). The updater already brings
# zip 4.6.1, and deflate-flate2 builds on the flate2 and miniz_oxide the
# app has, where the deflate feature would add zopfli and zlib-rs.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
# zip takes flate2 with no backend. macOS and Linux get the miniz_oxide
# backend from another crate, but the Windows build has none and fails to
# compile, so the app asks for flate2's default backend itself. The
# pinned split replays the tests store gzipped use it too.
flate2 = "1"

# Alert banners on Windows and Linux (Alerts Q1): WinRT toasts and the
# freedesktop server, with no telemetry. macOS posts through a module of
# Vosh's own on UNUserNotificationCenter instead, below.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "2"

# A toast click on an installed Windows Vosh starts the app again, since
# the toast has no activator of its own, so the second start hands its
# turn to the Vosh that runs (Alerts Q1).
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
# ToastNotifier.Setting, which says whether Windows lets Vosh show
# toasts, since the plugin says it always does. The toast crate the
# plugin uses brings this version and feature already.
windows = { version = "0.62", features = ["UI_Notifications"] }
# The round trip to the game reads the kernel's TCP numbers through
# SIO_TCP_INFO (Round Trip Readout P3). mio brings this version with
# these features already, so it adds no new crate.
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

# The round trip to the game reads the kernel's TCP numbers through
# getsockopt on macOS and Linux (Round Trip Readout P3). tokio brings
# libc already, so it adds no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Alert banners on macOS through UNUserNotificationCenter (Alerts Q1),
# with the click, the willPresent delegate and the permission check of
# Vosh's own. It needs the objc2 0.6 family it is built on, which the
# window crates already bring, so these add no new crate.
objc2-user-notifications = "0.3"
objc2-06 = { package = "objc2", version = "0.6" }
objc2-foundation = "0.3"
block2 = "0.6"
# Used by `enable_macos_spellcheck` in app/windows.rs to message-send
# setContinuousSpellCheckingEnabled: into the WKWebView (and by the native
# surface's NSView glue). Gated with respondsToSelector: so a future macOS
# that drops the setter degrades to a no-op instead of an
# unrecognized-selector crash.
objc2 = "0.5"
# Glyph rasterization on macOS goes through CoreGraphics directly
# (core-graphics/core-text) with font smoothing OFF so the strokes match
# the webview's antialiased text instead of the heavier smoothed look.
core-graphics = "0.23"
core-text = "20"
# The font list reads each family's monospace trait from its CoreText
# font descriptor (app/system_fonts.rs). 0.9 is the version core-text 20 uses.
core-foundation = "0.9"
# Tier 3 native terminal renderer (docs/native-renderer.md), macOS only
# like the `native_surface` cfg in build.rs. wgpu drives a Metal surface;
# pollster blocks on its async init during setup; raw-window-handle
# bridges the native view.
wgpu = "0.20"
pollster = "0.3"
raw-window-handle = "0.6"
# Terminal grid model (VTE parser + cell grid + scrollback) fed by the
# post-telnet byte stream; the wgpu renderer draws this grid (M2b/M2c).
# Off macOS the grid builds for the tests too, through the dev table below.
alacritty_terminal = "0.24"
# font-kit selects the font and supplies metrics + glyph bounds.
# pathfinder_geometry supplies its transform types.
pathfinder_geometry = "0.5"
# Cast the per-cell instance + uniform structs to bytes for wgpu buffers.
bytemuck = { version = "1", features = ["derive"] }
# alacritty_terminal compiles a unix tty (PTY) module we never use; it
# pulls rustix-openpty, whose rustix builds without the `std` feature and
# its fd types then fail to bridge to std's OwnedFd. Force `std` on so
# Cargo unifies the feature across the graph and the tty module compiles.
rustix = { version = "0.38", features = ["std"] }

[dev-dependencies]
tempfile = "3"
# Paused time, so the walk tests run the ten second backstop on a clock
# they control. The feature adds no new crate.
tokio = { workspace = true, features = ["test-util"] }
# The fake Aabahran and its wire cases, which the session tests drive the
# real session against.
vosh-prompt = { path = "../crates/prompt", features = ["testkit"] }
# The alias builders the input, session, command and fake MUD tests use,
# and trigger::process and TriggerStore::len, which the session, command
# and input tests use.
vosh-automation = { path = "../crates/automation", features = ["testkit"] }
# LogStore::in_memory and the other test only log calls, which the
# session, prompt lookup, hidden input and password wipe tests use.
vosh-log = { path = "../crates/log", features = ["testkit"] }
# An engine whose Lua can nap, which the Lua timer tests use to make a
# slow handler.
vosh-script = { path = "../crates/script", features = ["testkit"] }
# The mock runtime lets a test open windows and count what each event
# reaches. The feature adds no new crate.
tauri = { version = "2", features = ["test"] }
# The menu bar test parses every accelerator with the parser Tauri uses,
# because Tauri drops one that fails without a word. Tauri already
# depends on muda, so this adds no new crate.
[target.'cfg(target_os = "macos")'.dev-dependencies]
muda = { version = "0.19", default-features = false }

# The session, pointer and fake MUD tests read the native grid, so off
# macOS the grid builds for the tests as well. As a dev dependency it
# never reaches a release build there.
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
alacritty_terminal = "0.24"

# alacritty_terminal compiles a unix tty (PTY) module we never use; it
# pulls rustix-openpty, whose rustix builds without the `std` feature and
# its fd types then fail to bridge to std's OwnedFd. Force `std` on so
# Cargo unifies the feature across the graph and the tty module compiles.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "0.38", features = ["std"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
