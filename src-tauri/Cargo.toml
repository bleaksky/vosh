[package]
name = "mudclient-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri shell for the mudclient desktop app."
rust-version.workspace = true

[lib]
name = "mudclient_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
mudclient-telnet = { path = "../crates/telnet" }
mudclient-alias = { path = "../crates/alias" }
mudclient-vars = { path = "../crates/vars" }
mudclient-trigger = { path = "../crates/trigger" }
mudclient-gmcp = { path = "../crates/gmcp" }
mudclient-ansi = { path = "../crates/ansi" }
mudclient-map = { path = "../crates/map" }
mudclient-script = { path = "../crates/script" }
regex = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
