[package]
name = "vosh-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri shell for the Vosh desktop app."
rust-version.workspace = true

[lib]
name = "vosh_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
vosh-telnet = { path = "../crates/telnet" }
vosh-alias = { path = "../crates/alias" }
vosh-vars = { path = "../crates/vars" }
vosh-trigger = { path = "../crates/trigger" }
vosh-gmcp = { path = "../crates/gmcp" }
vosh-ansi = { path = "../crates/ansi" }
vosh-map = { path = "../crates/map" }
vosh-script = { path = "../crates/script" }
vosh-log = { path = "../crates/log" }
regex = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
