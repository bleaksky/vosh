<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Kanso Zen background with a subtle border so the icon reads against
       both light and dark dock backgrounds. -->
  <rect width="1024" height="1024" rx="180" ry="180" fill="#090e13"/>
  <rect x="14" y="14" width="996" height="996" rx="166" ry="166"
        fill="none" stroke="#1f2630" stroke-width="6"/>

  <!-- Two crossed swords, mirroring the target HUD's ⚔⚔ glyph but
       drawn as paths so they render the same regardless of platform
       emoji fonts. Pink accent matches MAP_COLORS.origin. -->
  <g transform="translate(512 512)">
    <!-- back sword, slightly muted -->
    <g transform="rotate(-45)">
      <!-- blade -->
      <rect x="-32" y="-360" width="64" height="540" rx="14" ry="14"
            fill="#7a1d4a"/>
      <!-- blade highlight -->
      <rect x="-14" y="-350" width="14" height="510" rx="6" ry="6"
            fill="#a52866"/>
      <!-- guard -->
      <rect x="-150" y="180" width="300" height="44" rx="10" ry="10"
            fill="#c5c9c7"/>
      <!-- grip -->
      <rect x="-22" y="224" width="44" height="120" rx="10" ry="10"
            fill="#3a3a44"/>
      <!-- pommel -->
      <circle cx="0" cy="358" r="34" fill="#a4a7a4"/>
    </g>
    <!-- front sword in the hot-pink accent -->
    <g transform="rotate(45)">
      <rect x="-32" y="-360" width="64" height="540" rx="14" ry="14"
            fill="#ff3399"/>
      <rect x="-14" y="-350" width="14" height="510" rx="6" ry="6"
            fill="#ffb3d6"/>
      <rect x="-150" y="180" width="300" height="44" rx="10" ry="10"
            fill="#f0f3f1"/>
      <rect x="-22" y="224" width="44" height="120" rx="10" ry="10"
            fill="#3a3a44"/>
      <circle cx="0" cy="358" r="34" fill="#c5c9c7"/>
    </g>
  </g>
</svg>
