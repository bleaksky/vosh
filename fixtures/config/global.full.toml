theme = "custom-dusk"
auto_update = true
keep_last_command = true
font_family = "JetBrains Mono, monospace"
font_size = 16
follow_system_appearance = true
light_theme = "kanso-pearl"
dark_theme = "tokyo-night"
theme_follow = "system"
day_theme = "kanso-pearl"
night_theme = "custom-dusk"
color_vision = "protanopia"
terminal_line_height = "compact"
panel_font = "system"
panel_font_size = 0

[[dock_layout]]
id = "map"
zone = "left"
align = "bottom"

[[custom_themes]]
id = "custom-dusk"
label = "Dusk"
description = "A warm dark theme"

[custom_themes.xterm]
background = "#1a1b26"
foreground = "#c0caf5"

[custom_themes.chrome]
accent = "#ff9e64"
surface = "#16161e"

[custom_themes.fitted]
brightBlack = "#94989f"
red = "#cb7b74"
