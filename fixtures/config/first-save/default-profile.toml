[profile_vars]

[tick]
enabled = true
interval_secs = 30
sound = true

[ui]
theme = "obsidian-ember"
follow_system_appearance = false
light_theme = "vellum"
dark_theme = ""
auto_update = false
font_family = "\"JetBrainsMono Bundled\", Menlo, Consolas, ui-monospace, monospace"
font_size = 14
terminal_line_height = "default"
tracked_affects = []
enabled_presets = ["none"]
dock_layout = []
keep_last_command = false
bright_bold = false
custom_themes = []
echo_macros = true
input_echo_caret = true
side_panels_fill_height = false
paste_line_delay_ms = 500
spellcheck_prompt = false
writing_offer = true
input_cursor_style = "block"
prompt_template_enabled = false
prompt_template = ""
vitals_density = "rows"
vitals_values = "current-max"
vitals_meter = "line"
vitals_warn_thirds = false
vitals_hide_when_pinned = true
moons_position = "right-edge"
chip_style = "value_only"
tick_count = "up"
affects_style = "timers"
affects_marker = "dot"
