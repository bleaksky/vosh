template_enabled = false
template = "%hp(%pct_hp)h %mn(%pct_mn)m %mv(%pct_mv)v - (%tick) - %time"
hp_color = ""
mn_color = ""
mv_color = ""
use_color_ramp = true
bar_font = ""
low_hp_vignette = false

[plugins]
enabled = []
